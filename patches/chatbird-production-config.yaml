model:
  provider: xiaomi
  model: mimo-v2.5

# One shared transcript per Discord channel; the patched session suffix keeps
# every Guild in a separate session and memory namespace.
group_sessions_per_user: false

web:
  # Both are no-key and request-driven; the extractor has no resident service.
  search_backend: ddgs
  extract_backend: simple-http
  # Local Chromium starts only after the primary provider fails. Public users
  # still receive only web_search/web_extract, never browser_*.
  browser_fallback:
    enabled: true
    search: true
    extract: true
    require_cloud: false
    max_pages: 2
    settle_seconds: 8
    min_content_chars: 200
    max_content_chars: 100000
    reader_enabled: true
    reader_allowed_hosts:
      - www.vicioussyndicate.com
    reader_timeout_seconds: 20

browser:
  cloud_provider: local
  engine: chrome

discord:
  require_mention: true
  thread_require_mention: true
  auto_thread: false
  allowed_channels:
    - "1146359015715110992"
    - "1149352792532734052" # Temporary voice rooms and their built-in text chat
    - "1170057013569536100"
    - "1395894673792569374"
    - "921407984586866781"
    - "1154706638901612625" # Bird Gaming administrator channel
    - "1220876330913234944" # 秘密研究 administrator channel
  history_backfill: true
  history_backfill_limit: 50
  allowed_guilds:
    - "1146359014968537089"
    - "921407984586866778"

memory:
  memory_enabled: true
  user_profile_enabled: false

platforms:
  discord:
    extra:
      slash_commands: true

plugins:
  enabled:
    - chatbird-policy
