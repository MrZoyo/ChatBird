model:
  provider: anthropic
  default: claude-sonnet-5-5

# Text auxiliary tasks inherit model.default; vision is pinned explicitly so
# it never falls back to another provider's default vision model.
auxiliary:
  vision:
    provider: anthropic
    model: claude-sonnet-5-5

# Used only when the primary model fails; every new turn tries the primary first.
# Vision stays pinned above, so image analysis fails instead of failing over.
fallback_model:
  provider: xiaomi
  model: mimo-v2.6-flash

# A MEDIA: line in a reply uploads that file to the channel. The default mode
# accepts almost any file, including sessions and memory, so only Hermes's own
# cache directories may be delivered here.
gateway:
  strict: true
  trust_recent_files: false

# One shared transcript per Discord channel; the patched session suffix keeps
# every Guild in a separate session and memory namespace.
group_sessions_per_user: false

# Tool progress cards would show internal tool calls in a public channel.
display:
  tool_progress: false

# The policy plugin bounds its own prompt. Spilling it to a file past 10,000 characters
# would replace the access policy with a preview and a read_file hint.
hooks:
  output_spill:
    enabled: false

# Hermes hides plugin tools behind a tool_search bridge by default. The policy gate
# allows only named tools, so the bridge would hide chatbird_* from public turns.
# Runtime package installs and the Nous connector gateway stay off on a public bot.
tools:
  tool_search:
    enabled: "off"
  connectors:
    enabled: false

security:
  allow_lazy_installs: false

web:
  # Both are no-key and request-driven; the extractor has no resident service.
  search_backend: ddgs
  extract_backend: simple-http
  # A failed search or extract must not fall through to the anonymous Exa, Parallel,
  # Firecrawl and Keenable tiers: that sends user queries and URLs to third parties and
  # would fetch sites whose robots rules only allow index use.
  keyless_fallback: false
  keyless_rescue: false
  # Local Chromium starts only after the primary provider fails. Public users
  # still receive only web_search/web_extract, never browser_*.
  browser_fallback:
    enabled: true
    search: true
    extract: true
    require_cloud: false
    max_pages: 2
    settle_seconds: 8
    min_content_chars: 200
    max_content_chars: 100000
    reader_enabled: true
    reader_allowed_hosts:
      - www.vicioussyndicate.com
    reader_timeout_seconds: 20
    # Zendesk Help Center article pages that challenge non-browser clients
    # are read from the public Help Center article API before Chromium.
    zendesk_article_api_hosts:
      - support.discord.com

browser:
  # "off" keeps the agent-browser driver the restricted fallback and admin tools use.
  # Hermes otherwise defaults to the Browser Use CLI and hides the browser_* tools.
  backend: "off"
  cloud_provider: local
  engine: chrome

discord:
  require_mention: true
  thread_require_mention: true
  auto_thread: false
  allowed_channels:
    - "1146359015715110992"
    - "1149352792532734052" # Temporary voice rooms and their built-in text chat
    - "1170057013569536100"
    - "1395894673792569374"
    - "921407984586866781"
    - "1154706638901612625" # Bird Gaming administrator channel
    - "1220876330913234944" # 秘密研究 administrator channel
    - "1146803504166473728"
    - "1353823382390440066"
    - "1163868678597656647"
  history_backfill: true
  history_backfill_limit: 200
  allowed_guilds:
    - "1146359014968537089"
    - "921407984586866778"

memory:
  memory_enabled: true
  user_profile_enabled: false

platforms:
  discord:
    extra:
      slash_commands: true

plugins:
  enabled:
    - chatbird-policy
